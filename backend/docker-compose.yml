services:
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow
    volumes:
      - shopflow_pg_data:/var/lib/postgresql/data
      - ./docker/init-rls.sql:/docker-entrypoint-initdb.d/01-init-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: shopflow
      DATABASE_PASSWORD: shopflow
      DATABASE_NAME: shopflow
      JWT_SECRET: local-docker-jwt-secret-change-before-production
      PLATFORM_SECRET: local-docker-platform-secret-change-before-production
      CORS_ORIGIN: http://localhost:3000
      SEED_ON_BOOT: "true"
      ALLOW_SQLITE_SYNC: "false"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    
volumes:
  shopflow_pg_data:
